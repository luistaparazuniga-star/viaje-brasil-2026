<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Rings -->
  <circle cx="256" cy="235" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <circle cx="256" cy="235" r="145" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Tropical Sun / Brazil Yellow Circle -->
  <circle cx="256" cy="225" r="105" fill="url(#sun)" opacity="0.95" filter="url(#glow)"/>

  <!-- Waves -->
  <path d="M70 365 Q160 340 256 365 T442 365 L442 430 L70 430 Z" fill="#065f46" opacity="0.8"/>
  <path d="M70 390 Q170 365 256 390 T442 390 L442 440 L70 440 Z" fill="#047857"/>

  <!-- Cristo Redentor Silhouette (Iconic Arms) -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="256" cy="155" r="16"/>
    <path d="M245 173 L267 173 L273 335 L239 335 Z"/>
    <rect x="230" y="335" width="52" height="20" rx="3"/>
    <rect x="220" y="355" width="72" height="15" rx="3"/>
    <path d="M140 188 C175 186 215 182 245 180 L245 196 C220 198 180 203 140 205 Q132 205 132 196 Q132 188 140 188 Z"/>
    <path d="M372 188 C337 186 297 182 267 180 L267 196 C292 198 332 203 372 205 Q380 205 380 196 Q380 188 372 188 Z"/>
  </g>

  <!-- Palm Leaf left side -->
  <path d="M95 330 C110 290 145 250 180 230 C168 255 162 280 168 305 C145 310 120 320 95 330 Z" fill="#10b981" opacity="0.8"/>

  <!-- Airplane Accent -->
  <path d="M365 115 L390 130 L380 135 L363 127 L350 133 L353 139 L345 141 L337 130 L320 133 L317 127 L330 120 L333 105 L340 105 L342 117 Z" fill="#fef08a" filter="url(#glow)"/>

  <!-- 2026 Badge Pill -->
  <rect x="166" y="415" width="180" height="48" rx="24" fill="url(#gold)" filter="url(#glow)"/>
  <text x="256" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#1e1b4b" text-anchor="middle" letter-spacing="2">BRASIL 2026</text>
</svg>